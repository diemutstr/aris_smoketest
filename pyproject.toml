[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aris"
version = "0.1.0"
description = "Planner, drawing server and calibration for the six-arm drawing rig"
requires-python = ">=3.10"
# aris_fr3_ik and aris_collide_native are built from native/ (pip install ./native/fr3_ik ...)
dependencies = ["numpy", "scipy", "aris_fr3_ik", "svgelements"]

[project.optional-dependencies]
check = ["drake"]
gui = ["fastapi", "uvicorn"]
dev = ["pytest", "httpx"]

[project.scripts]
aris = "aris.cli:main"

[tool.setuptools.packages.find]
include = ["aris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds; left out of the quick set"]
