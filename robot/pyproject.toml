[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aris_robot"
version = "0.1.0"
description = "Operator PC side of the drawing rig: arm driver, pen force, job runner"
requires-python = ">=3.10"
# rclpy and the ROS messages come from the ROS 2 install (venv with --system-site-packages)
dependencies = ["aris", "numpy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "fastapi", "uvicorn"]
# The calibration driver (calib.py, desk.py): libfranka and Desk through panda-py.  The wheel
# is built against ONE libfranka version, which must suit the robots' system version (Desk:
# Settings -> System).  PyPI's wheel is the default build; another libfranka needs the wheel
# from https://github.com/JeanElsner/panda-py/releases instead (robot/README.md).
calib = ["panda-python==1.1.1"]   # the newest on PyPI, 2026-10-05

[project.scripts]
aris-robot = "aris_robot.cli:main"

[tool.setuptools.packages.find]
include = ["aris_robot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds; left out of the quick set"]
