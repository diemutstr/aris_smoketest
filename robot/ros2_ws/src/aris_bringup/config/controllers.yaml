# The controllers of one arm.  This file is the template: `aris-robot serve` writes one copy
# per arm with its joint names and, for fake hardware, the position interface for the
# trajectory controller.  Node names are wildcards so the same file works in every namespace
# (arm_<slot>).  One controller moves the arm: fr3_arm_controller, the joint trajectory
# controller, for every motion (joint position control, Pete 2026-10-07).

/**/controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    fr3_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

/**/franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: fr3
    update_rate: 100   # the driver reads the robot mode and errors; it needs no 1 kHz copy

/**/joint_state_broadcaster:
  ros__parameters:
    update_rate: 100

/**/fr3_arm_controller:
  ros__parameters:
    joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    # The trajectory is flown as sent: positions and velocities at their times, joined by
    # the cubic that matches both (the planner's own definition).  Never re-timed.
    interpolation_method: splines
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    # the operator stack's gains (franka_fr3_moveit_config/config/fr3_ros_controllers.yaml)
    gains:
      fr3_joint1: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint2: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint3: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint4: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint5: {p: 250.0, d: 10.0, i: 0.0, i_clamp: 1.0}
      fr3_joint6: {p: 150.0, d: 10.0, i: 0.0, i_clamp: 1.0}
      fr3_joint7: {p: 50.0, d: 5.0, i: 0.0, i_clamp: 1.0}
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 3.0     # on the arms (2026-10-06): 0.5 s was too tight
      # abort a move that strays this far from the trajectory (rad), and the goal tolerance
      # (0.03 rad: what worked on the arms, 2026-10-06; 0.005 was too tight for a holding arm)
      fr3_joint1: {trajectory: 0.05, goal: 0.03}
      fr3_joint2: {trajectory: 0.05, goal: 0.03}
      fr3_joint3: {trajectory: 0.05, goal: 0.03}
      fr3_joint4: {trajectory: 0.05, goal: 0.03}
      fr3_joint5: {trajectory: 0.05, goal: 0.03}
      fr3_joint6: {trajectory: 0.05, goal: 0.03}
      fr3_joint7: {trajectory: 0.05, goal: 0.03}
